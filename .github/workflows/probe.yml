name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "scripts")
          import collect, fetch_brokers as fb
          for url in ["https://profit.pakistantoday.com.pk/2026/08/01/short-term-inflation-eases-091percent-wow-remains-up-905percent-yoy",
                      "https://www.dawn.com/news/1946000"]:
              snap = collect.wayback_save(url)
              raw = collect.get(re.sub(r"/web/(\d+)/", r"/web/\1id_/", snap, count=1)) if snap else b""
              pub, body = fb.article(raw) if raw else ("", "")
              print("SNAP", snap, "| bytes", len(raw), "| published", pub, "| body chars", len(body))
          PY
