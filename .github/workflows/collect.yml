name: collect

# Twice daily (11:17 and 20:17 PKT). Two windows because GitHub's scheduler delays and drops
# runs; the 20:17 run on the last day of a month still commits before 00:00 PKT.
on:
  schedule:
    - cron: "17 6,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Collect
        id: collect
        run: python scripts/collect.py
        continue-on-error: true
      # Commit whatever was collected even if one step failed, then fail the run so it shows red.
      - name: Commit
        run: |
          git config user.name "tally-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/cpi
          git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
      - if: steps.collect.outcome == 'failure'
        run: exit 1
